name: CI — Build & Test

on:
  pull_request:
    branches: [main]

jobs:
  detect-and-build:
    runs-on: ubuntu-latest
    outputs:
      project-type: ${{ steps.detect.outputs.type }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: Detect project type
        run: |
          if [ -f "Package.swift" ] || [ -f "*.xcodeproj" ] || [ -f "project.yml" ]; then
            echo "type=swift" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ]; then
            echo "type=node" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "type=python" >> $GITHUB_OUTPUT
          elif [ -f "Gemfile" ]; then
            echo "type=ruby" >> $GITHUB_OUTPUT
          elif [ -f "manifest.json" ] && grep -q "manifest_version" manifest.json 2>/dev/null; then
            echo "type=chrome-extension" >> $GITHUB_OUTPUT
          elif [ -f "shopify" ] || [ -d "sections" ] && [ -d "templates" ]; then
            echo "type=shopify" >> $GITHUB_OUTPUT
          else
            echo "type=static" >> $GITHUB_OUTPUT
          fi

  swift:
    needs: detect-and-build
    if: needs.detect-and-build.outputs.project-type == 'swift'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen if needed
        run: |
          if [ -f "project.yml" ]; then
            brew install xcodegen
            xcodegen generate
          fi

      - name: Build
        run: |
          SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c "import sys,json; schemes=json.load(sys.stdin).get('project',{}).get('schemes',[]); print(schemes[0] if schemes else '')" 2>/dev/null || echo "")
          if [ -n "$SCHEME" ]; then
            xcodebuild build -scheme "$SCHEME" -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20
          else
            echo "No scheme found — skipping build"
          fi

      - name: Test
        run: |
          SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c "import sys,json; schemes=json.load(sys.stdin).get('project',{}).get('schemes',[]); print(schemes[0] if schemes else '')" 2>/dev/null || echo "")
          if [ -n "$SCHEME" ]; then
            xcodebuild test -scheme "$SCHEME" -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20 || true
          fi

  node:
    needs: detect-and-build
    if: needs.detect-and-build.outputs.project-type == 'node'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Lint
        run: npm run lint 2>/dev/null || true
      - name: Build
        run: npm run build 2>/dev/null || true
      - name: Test
        run: npm test 2>/dev/null || true

  python:
    needs: detect-and-build
    if: needs.detect-and-build.outputs.project-type == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 2>/dev/null || pip install -e . 2>/dev/null || true
      - name: Lint
        run: python -m flake8 . 2>/dev/null || true
      - name: Test
        run: python -m pytest 2>/dev/null || python -m unittest discover 2>/dev/null || true

  ruby:
    needs: detect-and-build
    if: needs.detect-and-build.outputs.project-type == 'ruby'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Lint
        run: bundle exec rubocop 2>/dev/null || true
      - name: Test
        run: bundle exec rake test 2>/dev/null || bundle exec rspec 2>/dev/null || true

  chrome-extension:
    needs: detect-and-build
    if: needs.detect-and-build.outputs.project-type == 'chrome-extension'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: python3 -c "import json; d=json.load(open('manifest.json')); assert d.get('manifest_version') in [2,3], 'Invalid manifest version'; print('Manifest OK')"
      - name: Check referenced files exist
        run: |
          python3 -c "
          import json, os
          m = json.load(open('manifest.json'))
          missing = []
          for key in ['default_popup', 'default_page']:
            p = m.get('action', m.get('browser_action', {})).get(key, '')
            if p and not os.path.exists(p): missing.append(p)
          for size, path in m.get('icons', {}).items():
            if not os.path.exists(path): missing.append(path)
          if missing: print(f'Missing files: {missing}'); exit(1)
          print('All referenced files exist')
          "
      - name: NPM test if available
        run: |
          if [ -f "package.json" ]; then
            npm install && npm test 2>/dev/null || true
          fi

  shopify:
    needs: detect-and-build
    if: needs.detect-and-build.outputs.project-type == 'shopify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install theme check
        run: gem install theme-check
      - name: Run theme check
        run: theme-check . 2>/dev/null || true

  static:
    needs: detect-and-build
    if: needs.detect-and-build.outputs.project-type == 'static'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        run: |
          for f in $(find . -name "*.html" | head -10); do
            echo "Checking $f"
            python3 -c "
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.errors=[]
              def handle_starttag(self,t,a): pass
          p=P(); p.feed(open('$f').read()); print('  OK')
          " 2>/dev/null || echo "  Warning: could not parse"
          done
